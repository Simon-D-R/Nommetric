[package]
name = "nommetric"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
firefox = []

[dependencies]
nommetric-core = { path = "../core" }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.104"
serde = "1.0"
serde_json = "1.0"
console_error_panic_hook = "0.1.7"
log = "0.4"
web-extensions-sys = "0.4.2"
gloo-utils = { version = "0.3", features = ["serde"] }
gloo-timers = "0.3"

[dependencies.web-sys]
version = "0.3.104"
features = [
	"console",
	"CssStyleDeclaration",
	"CssStyleSheet",
	"Document",
	"DocumentFragment",
	"Element",
	"Event",
	"EventTarget",
	"HtmlElement",
	"Location",
	"MutationObserver",
	"MutationObserverInit",
	"Node",
	"NodeList",
	"Request",
	"RequestCache",
	"RequestInit",
	"Response",
	"ShadowRoot",
	"ShadowRootInit",
	"ShadowRootMode",
	"Window"
]
