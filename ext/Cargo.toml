[package]
name = "nommetric"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
nommetric-core = { path = "../core" }
wasm-bindgen = "0.2.127"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3.104"
features = ["console", "Window", "Location", "Document"]
